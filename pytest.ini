[pytest]
addopts = --basetemp=runtime/pytest-temp
cache_dir = .runtime/pytest-cache
norecursedirs =
    .git
    .pytest_cache
    .runtime
    .tmp
    archive
    research
    frontend/node_modules
    frontend/dist
    venv
    runtime/pytest-cache
    runtime/pytest-temp
    runtime/pytest-workspace

markers =
    slow: Mark integration/governance tests that are slow and should not run in fast dev cycles.
    governance: Mark governance and release-audit tests.

filterwarnings =
    ignore:.*If you are loading a serialized model.*:UserWarning
    ignore:Device used.*:UserWarning
    ignore:X does not have valid feature names, but LGBMClassifier was fitted with feature names:UserWarning
    ignore:Please import .*spmatrix.*:DeprecationWarning
