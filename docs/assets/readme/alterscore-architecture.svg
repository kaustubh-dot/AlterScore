<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 620" role="img" aria-labelledby="diagram-title diagram-description">
      <title id="diagram-title">AlterScore runtime architecture</title>
      <desc id="diagram-description">React sends an assessment to a FastAPI v2 service. The service issues opaque attempts, passes responses to a deterministic scorer, stores bounded records, and returns a signed redacted result.</desc>
      <defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

    :root {
      --paper: #070708;
      --paper-2: #0e0e10;
      --ink: #f4f1eb;
      --muted: #aeb0ba;
      --soft: #6f7480;
      --rule: rgba(244, 241, 235, 0.14);
      --accent: #06b6d4;
      --accent-tint: rgba(6, 182, 212, 0.1);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-width: 960px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: 1200px; margin: 0 auto; padding: 56px 40px 40px; }
    .eyebrow, .footer, .zone-label, .node-tag, .node-meta, .legend-label, .legend-item {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 600; }
    h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 400; line-height: 1.08; }
    .subtitle { max-width: 640px; margin: 16px 0 32px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    svg { display: block; width: 1120px; height: 620px; overflow: visible; }
    .footer { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--soft); font-size: 10px; }
    .zone { fill: rgba(244, 241, 235, 0.018); stroke: var(--rule); stroke-width: 1; }
    .zone-mask, .label-mask { fill: var(--paper); }
    .zone-label { fill: var(--soft); font-size: 10px; font-weight: 600; }
    .connector { fill: none; stroke: var(--muted); stroke-width: 2; marker-end: url(#arrow); }
    .connector-accent { stroke: var(--accent); marker-end: url(#arrow-accent); }
    .node { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
    .node-focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .node-name { fill: var(--ink); font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; }
    .node-meta { fill: var(--muted); font-size: 10px; }
    .node-note { fill: var(--soft); font-family: Inter, sans-serif; font-size: 12px; }
    .arrow-label { fill: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-anchor: middle; }
    .legend-label { fill: var(--soft); font-size: 10px; font-weight: 600; }
    .legend-item { fill: var(--muted); font-size: 10px; }

</style>
        <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#aeb0ba" /></marker>
        <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#06b6d4" /></marker>
      </defs>

      <!-- Zones -->
      <rect class="zone" x="32" y="48" width="296" height="468" rx="8" />
      <rect class="zone" x="352" y="48" width="352" height="468" rx="8" />
      <rect class="zone" x="728" y="48" width="360" height="468" rx="8" />
      <rect class="zone-mask" x="52" y="52" width="94" height="20" rx="2" />
      <text class="zone-label" x="60" y="66">BROWSER</text>
      <rect class="zone-mask" x="372" y="52" width="74" height="20" rx="2" />
      <text class="zone-label" x="380" y="66">API</text>
      <rect class="zone-mask" x="748" y="52" width="126" height="20" rx="2" />
      <text class="zone-label" x="756" y="66">SERVER STATE</text>

      <!-- Connectors first -->
      <path class="connector" d="M296 230 H344 Q352 230 352 222 V182 Q352 174 360 174 H408" />
      <rect class="label-mask" x="304" y="186" width="72" height="20" rx="2" />
      <text class="arrow-label" x="340" y="200">HTTPS</text>
      <path class="connector connector-accent" d="M528 222 V318" />
      <rect class="label-mask" x="542" y="252" width="68" height="20" rx="2" />
      <text class="arrow-label" x="576" y="266">SCORE</text>
      <path class="connector" d="M648 174 H768" />
      <rect class="label-mask" x="662" y="146" width="92" height="20" rx="2" />
      <text class="arrow-label" x="708" y="160">ISSUE + TTL</text>
      <path class="connector connector-accent" d="M648 366 H768" />
      <rect class="label-mask" x="656" y="338" width="112" height="20" rx="2" />
      <text class="arrow-label" x="712" y="352">SIGNED RESULT</text>
      <path class="connector" d="M944 222 V318" />
      <rect class="label-mask" x="956" y="252" width="94" height="20" rx="2" />
      <text class="arrow-label" x="1003" y="266">VERIFY</text>

      <!-- Nodes -->
      <rect class="node" x="64" y="182" width="232" height="96" rx="8" />
      <text class="node-name" x="180" y="220" text-anchor="middle">React + Vite UI</text>
      <text class="node-meta" x="180" y="246" text-anchor="middle">QUICK TRIAL / FULL ASSESSMENT</text>
      <text class="node-note" x="180" y="264" text-anchor="middle">responsive, session-aware</text>

      <rect class="node" x="408" y="126" width="240" height="96" rx="8" />
      <text class="node-name" x="528" y="164" text-anchor="middle">FastAPI v2</text>
      <text class="node-meta" x="528" y="190" text-anchor="middle">FORM / SCORE / VERIFY</text>
      <text class="node-note" x="528" y="208" text-anchor="middle">opaque attempt lifecycle</text>

      <rect class="node-focal" x="408" y="318" width="240" height="96" rx="8" />
      <text class="node-name" x="528" y="356" text-anchor="middle">Deterministic scorer</text>
      <text class="node-meta" x="528" y="382" text-anchor="middle">STATEFUL RUBRIC</text>
      <text class="node-note" x="528" y="400" text-anchor="middle">reconciled explanation</text>

      <rect class="node" x="768" y="126" width="352" height="96" rx="8" />
      <text class="node-name" x="944" y="164" text-anchor="middle">Bounded session stores</text>
      <text class="node-meta" x="944" y="190" text-anchor="middle">ATTEMPTS / VERIFICATION / RATE LIMIT</text>
      <text class="node-note" x="944" y="208" text-anchor="middle">short-lived, redacted records</text>

      <rect class="node-focal" x="768" y="318" width="352" height="96" rx="8" />
      <text class="node-name" x="944" y="356" text-anchor="middle">Signed redacted result</text>
      <text class="node-meta" x="944" y="382" text-anchor="middle">HMAC-SHA256 / PUBLIC PROOF</text>
      <text class="node-note" x="944" y="400" text-anchor="middle">no scoring authority in the browser</text>

      <text class="node-note" x="768" y="464">The serving image imports no model artifacts.</text>
      <text class="node-note" x="768" y="484">The score is generated by ordinary Python code.</text>

      <!-- Legend -->
      <line x1="32" y1="552" x2="1088" y2="552" stroke="var(--rule)" stroke-width="1" />
      <text class="legend-label" x="32" y="580">LEGEND</text>
      <line x1="124" y1="576" x2="180" y2="576" class="connector" />
      <text class="legend-item" x="196" y="580">request / state transition</text>
      <rect class="node-focal" x="420" y="564" width="16" height="16" rx="4" />
      <text class="legend-item" x="452" y="580">focal decision or proof</text>
      <text class="legend-item" x="780" y="580">All coordinates follow a 4px grid.</text>
    </svg>
