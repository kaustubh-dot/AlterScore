name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: https://huggingface.co/spaces/coolbot22/alterscore-backend
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip When Token Is Missing
        if: env.HF_TOKEN == ''
        run: |
          echo "::warning::HF_TOKEN is not configured, so Hugging Face deployment was skipped."

      - name: Build Backend Space Package
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          SPACE_DIR="$RUNNER_TEMP/alterscore-hf-space"
          rm -rf "$SPACE_DIR"
          mkdir -p "$SPACE_DIR"

          cp -R backend "$SPACE_DIR/backend"
          cp Dockerfile "$SPACE_DIR/Dockerfile"

          cat > "$SPACE_DIR/README.md" <<'EOF'
          ---
          title: AlterScore Public API
          emoji: 📊
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          # AlterScore Public API

          Artifact-free deterministic v2 assessment API for AlterScore.
          EOF

      - name: Push Backend Package
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          SPACE_DIR="$RUNNER_TEMP/alterscore-hf-space"
          cd "$SPACE_DIR"
          git init
          git config user.email "bot@alterscore.ai"
          git config user.name "AlterScore Deployment Bot"
          git remote add origin "https://coolbot22:${HF_TOKEN}@huggingface.co/spaces/coolbot22/alterscore-backend"
          git add .
          git commit -m "deploy(hf): package backend runtime"
          git push origin HEAD:refs/heads/main --force
