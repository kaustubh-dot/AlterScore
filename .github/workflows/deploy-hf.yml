name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: https://huggingface.co/spaces/coolbot22/alterscore-backend
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Skip When Token Is Missing
        if: env.HF_TOKEN == ''
        run: |
          echo "::warning::HF_TOKEN is not configured, so Hugging Face deployment was skipped."

      - name: Install Git LFS
        if: env.HF_TOKEN != ''
        run: git lfs install

      - name: Build Backend Space Package
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          SPACE_DIR="$RUNNER_TEMP/alterscore-hf-space"
          rm -rf "$SPACE_DIR"
          mkdir -p "$SPACE_DIR"

          cp -R backend "$SPACE_DIR/backend"
          cp -R models "$SPACE_DIR/models"
          cp -R scripts "$SPACE_DIR/scripts"
          cp Dockerfile "$SPACE_DIR/Dockerfile"
          # Write a minimal .gitattributes for the backend deploy package.
          # The repo-level file now includes LFS rules for frontend assets
          # (*.webp, *.gif, *.svg, etc.) that are not shipped in the backend
          # package and would cause HF push rejections.
          printf '*.pkl filter=lfs diff=lfs merge=lfs -text\n*.pt filter=lfs diff=lfs merge=lfs -text\n*.png filter=lfs diff=lfs merge=lfs -text\n' > "$SPACE_DIR/.gitattributes"

          cat > "$SPACE_DIR/README.md" <<'EOF'
          ---
          title: AlterScore Backend
          emoji: 📊
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          # AlterScore Backend

          Manifest-backed FastAPI scoring backend for AlterScore.
          EOF

      - name: Push Backend Package
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          SPACE_DIR="$RUNNER_TEMP/alterscore-hf-space"
          cd "$SPACE_DIR"
          git init
          git lfs install
          git config user.email "bot@alterscore.ai"
          git config user.name "AlterScore Deployment Bot"
          git remote add origin "https://coolbot22:${HF_TOKEN}@huggingface.co/spaces/coolbot22/alterscore-backend"
          git add .
          git commit -m "deploy(hf): package backend runtime"
          git push origin HEAD:refs/heads/main --force
