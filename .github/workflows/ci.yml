name: AlterScore CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production-candidate-v1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - production-candidate-v1

jobs:
  lint:
    name: Code Quality & Syntax Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Black Formatter Check
        run: black --check backend scripts tests

      - name: Run Ruff Linter
        run: ruff check backend scripts tests

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Lint Checks
        run: |
          cd frontend
          npm ci
          # Run lint check if defined in package.json, otherwise verify compilation
          npm run lint --if-present

  backend-tests:
    name: Backend API & ML Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Complete Pytest Suite
        env:
          ALTERSCORE_ENV: test
        run: |
          python -m pytest --tb=short

  governance-validation:
    name: Governance & Reproducibility Check
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Reproducibility Check
        run: |
          python scripts/validation/verify_reproducibility.py

  frontend-build:
    name: Frontend Production Build compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Packages
        run: |
          cd frontend
          npm ci

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build
