name: AlterScore CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Code Quality & Syntax Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Black Formatter Check
        run: black --check backend tests

      - name: Run Ruff Linter
        run: ruff check backend tests



  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Lint runs as a non-blocking report. The production build below is the
      # hard gate; known react-hooks findings in the assessment/results flow are
      # tracked separately and must not fail the pipeline.
      - name: Run ESLint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build Production Bundle
        run: npm run build



  backend-tests:
    name: Backend API Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Complete Pytest Suite
        env:
          ALTERSCORE_ENV: test
        run: |
          python -m pytest --tb=short

