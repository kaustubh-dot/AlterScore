name: Roll back AlterScore release pair

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact previously reviewed 40-character release SHA
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to restore both targets
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: alterscore-production-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate reviewed rollback release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_SHA: ${{ github.sha }}
      CONTROL_REF: ${{ github.ref }}
      GITHUB_TOKEN: ${{ github.token }}
      FRONTEND_URL: https://alterscore.vercel.app
      BACKEND_URL: https://coolbot22-alterscore-backend.hf.space
    steps:
      - name: Require explicit confirmation and exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "ROLLBACK"
          test "$CONTROL_REF" = "refs/heads/main"
          test "${#RELEASE_SHA}" = "40"
          test "${#CONTROL_SHA}" = "40"
          case "$RELEASE_SHA" in
            (*[!0-9a-f]*) echo "release SHA is not lowercase hexadecimal" >&2; exit 1 ;;
          esac
          case "$CONTROL_SHA" in
            (*[!0-9a-f]*) echo "control SHA is not lowercase hexadecimal" >&2; exit 1 ;;
          esac
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the trusted rollback control plane
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require the current main control plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$CONTROL_SHA"

      - name: Set up Python for manifest validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require a verified post-smoke release manifest
        shell: bash
        run: |
          set -euo pipefail
          workflow_file="$RUNNER_TEMP/deploy-workflow.json"
          runs_dir="$RUNNER_TEMP/deploy-run-pages"
          run_selection="$RUNNER_TEMP/trusted-run.json"
          artifacts_file="$RUNNER_TEMP/release-run-artifacts.json"
          artifact_selection="$RUNNER_TEMP/trusted-artifact.json"

          curl --fail --silent --show-error --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-hf.yml" \
            > "$workflow_file"
          workflow_id="$(python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")).get("id"); assert isinstance(value, int) and value > 0; print(value)' "$workflow_file")"

          mkdir -p "$runs_dir"
          runs_args=()
          fetched_runs=0
          total_runs=-1
          for page in $(seq 1 10); do
            runs_file="$runs_dir/page-$page.json"
            curl --fail --silent --show-error --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&event=workflow_run&status=completed&head_sha=$RELEASE_SHA&per_page=100&page=$page" \
              > "$runs_file"
            page_count="$(python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print(len(value.get("workflow_runs", [])))' "$runs_file")"
            page_total="$(python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print(value.get("total_count", -1))' "$runs_file")"
            if [ "$total_runs" -eq -1 ]; then
              total_runs="$page_total"
            fi
            test "$page_total" -eq "$total_runs"
            fetched_runs=$((fetched_runs + page_count))
            runs_args+=(--runs-json "$runs_file")
            if [ "$fetched_runs" -ge "$total_runs" ]; then
              break
            fi
          done
          test "$fetched_runs" -eq "$total_runs"
          python scripts/ci/validate_release_provenance.py trusted-run \
            --workflow-json "$workflow_file" \
            "${runs_args[@]}" \
            --release-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$run_selection"
          run_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_id"])' "$run_selection")"

          curl --fail --silent --show-error --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=release-manifest-$RELEASE_SHA&per_page=100" \
            > "$artifacts_file"
          python scripts/ci/validate_release_provenance.py trusted-artifact \
            --selection-json "$run_selection" \
            --artifacts-json "$artifacts_file" \
            --release-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$artifact_selection"
          archive_url="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archive_download_url"])' "$artifact_selection")"

          curl --fail --silent --show-error --retry 3 -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$archive_url" -o "$RUNNER_TEMP/release-manifest.zip"
          python scripts/ci/validate_release_manifest.py \
            --archive "$RUNNER_TEMP/release-manifest.zip" \
            --release-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --frontend-url "$FRONTEND_URL" \
            --backend-url "$BACKEND_URL" \
            --workflow-run-id "$run_id"

  rollback:
    name: Restore matching frontend and backend release
    needs: validate-release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SIGNING_KEY_VERSION: ${{ secrets.ALTERSCORE_SIGNING_KEY_VERSION }}
      ALTERSCORE_SIGNING_SECRET: ${{ secrets.ALTERSCORE_SIGNING_SECRET }}
      HF_SPACE_REPO: https://huggingface.co/spaces/coolbot22/alterscore-backend
      BACKEND_URL: https://coolbot22-alterscore-backend.hf.space
      FRONTEND_URL: https://alterscore.vercel.app
    steps:
      - name: Checkout the verified release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          fetch-depth: 1

      - name: Require credentials and exact identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$SIGNING_KEY_VERSION"
          test -n "$ALTERSCORE_SIGNING_SECRET"
          test -n "$FRONTEND_URL"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Require provider signing readiness before restoration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/smoke_release.py --base-url "$BACKEND_URL" --preflight-signing

      - name: Restore exact backend package
        shell: bash
        run: |
          set -euo pipefail
          SPACE_DIR="$RUNNER_TEMP/alterscore-hf-space"
          rm -rf "$SPACE_DIR"
          python scripts/ci/prepare_hf_release.py --output "$SPACE_DIR" --release-sha "$RELEASE_SHA" --signing-key-version "$SIGNING_KEY_VERSION"
          cd "$SPACE_DIR"
          git init
          git config user.email "bot@alterscore.ai"
          git config user.name "AlterScore Rollback Bot"
          git add .
          git commit -m "rollback(hf): restore ${RELEASE_SHA}"
          git remote add origin "$HF_SPACE_REPO"
          git -c http.extraheader="AUTHORIZATION: Bearer $HF_TOKEN" push origin HEAD:refs/heads/main --force

      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact frontend release
        working-directory: frontend
        env:
          VITE_RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
        run: |
          npm ci
          npm run build

      - name: Promote exact frontend release
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@54.21.1 link --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --yes
          DEPLOYED_FRONTEND_URL="$(npx --yes vercel@54.21.1 deploy dist --prod --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --yes)"
          case "$DEPLOYED_FRONTEND_URL" in
            (https://*) ;;
            (*) echo "Vercel did not return an HTTPS deployment URL" >&2; exit 1 ;;
          esac
          printf 'DEPLOYED_FRONTEND_URL=%s\n' "$DEPLOYED_FRONTEND_URL" >> "$GITHUB_ENV"

      - name: Run paired release smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/smoke_release.py --base-url "$BACKEND_URL" --frontend-url "$DEPLOYED_FRONTEND_URL" --expected-release-sha "$RELEASE_SHA"
          python scripts/ci/smoke_release.py --base-url "$BACKEND_URL" --frontend-url "$FRONTEND_URL" --expected-release-sha "$RELEASE_SHA"
