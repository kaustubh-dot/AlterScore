<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>AlterScore | Credit Signal Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Automatically unregister any stale Service Workers that might be caching/intercepting requests
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) {
                console.log('Stale Service Worker unregistered.');
                window.location.reload();
              }
            });
          }
        });
      }

      window.addEventListener('error', function(event) {
        fetch('/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'error',
            message: event.message,
            filename: event.filename,
            lineno: event.lineno,
            colno: event.colno,
            stack: event.error ? event.error.stack : null,
            userAgent: navigator.userAgent
          })
        }).catch(err => {});
      });

      window.addEventListener('unhandledrejection', function(event) {
        fetch('/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'unhandledrejection',
            message: event.reason ? (event.reason.message || String(event.reason)) : 'Unhandled rejection',
            stack: event.reason ? event.reason.stack : null,
            userAgent: navigator.userAgent
          })
        }).catch(err => {});
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
